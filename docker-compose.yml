services:
  postgres:
    image: postgres:16-alpine
    container_name: rrss_creators_analyzer_postgres
    restart: unless-stopped
    env_file: ".env"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rrss_creators_analyzer}
      - POSTGRES_USER=${POSTGRES_USER:-rrss_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-db-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rrss_user} -d ${POSTGRES_DB:-rrss_creators_analyzer}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rrss_creators_analyzer_redis
    restart: unless-stopped
    env_file: ".env"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: rrss_creators_analyzer_web:latest
    container_name: rrss_creators_analyzer_web
    restart: unless-stopped
    env_file: ".env"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL:-admin/}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT:-False}
      - DEMO_MODE=${DEMO_MODE:-False}
      - DEMO_DATA_RETENTION_DAYS=${DEMO_DATA_RETENTION_DAYS:-7}
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED:-True}
      - RATELIMIT_ENABLE=${RATELIMIT_ENABLE:-True}
      - DATABASE_URL=postgres://${POSTGRES_USER:-rrss_user}:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/${POSTGRES_DB:-rrss_creators_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - WEB_CONCURRENCY=2
    volumes:
      - /srv/media/rrss-creators-analyzer:/app/rrss_creatos_analyzer/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    image: rrss_creators_analyzer_celery:latest
    container_name: rrss_creators_analyzer_celery_worker
    restart: unless-stopped
    command: /start-worker.sh
    env_file: ".env"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL:-admin/}
      - DEMO_MODE=${DEMO_MODE:-False}
      - DEMO_DATA_RETENTION_DAYS=${DEMO_DATA_RETENTION_DAYS:-7}
      - DATABASE_URL=postgres://${POSTGRES_USER:-rrss_user}:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/${POSTGRES_DB:-rrss_creators_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=2
      - CELERY_LOGLEVEL=INFO
    volumes:
      - /srv/media/rrss-creators-analyzer:/app/rrss_creatos_analyzer/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    image: rrss_creators_analyzer_celery:latest
    container_name: rrss_creators_analyzer_celery_beat
    restart: unless-stopped
    command: /start-beat.sh
    env_file: ".env"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL:-admin/}
      - DEMO_MODE=${DEMO_MODE:-False}
      - DEMO_DATA_RETENTION_DAYS=${DEMO_DATA_RETENTION_DAYS:-7}
      - DATABASE_URL=postgres://${POSTGRES_USER:-rrss_user}:${POSTGRES_PASSWORD:-change-me-db-password}@postgres:5432/${POSTGRES_DB:-rrss_creators_analyzer}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_LOGLEVEL=INFO
    volumes:
      - /srv/media/rrss-creators-analyzer:/app/rrss_creatos_analyzer/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
